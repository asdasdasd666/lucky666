.bg-red { background-color: var(--base-red-dim); } .bg-blue { background-color: var(--base-blue-dim); } .bg-green { background-color: var(--base-green-dim); }
.bg-action { background: linear-gradient(145deg, #f6ad55, #dd6b20); } .bg-reset { background: linear-gradient(145deg, #fc8181, #c53030); }
.num-btn.is-active { filter: grayscale(0%) brightness(1.1); opacity: 1; transform: scale(1.3); z-index: 20; animation: pulse-glow 2s infinite; box-shadow: 0 0 15px currentColor, 0 0 30px rgba(255,255,255,0.3), inset 0 0 0 2px rgba(255,255,255,0.5); background-image: none; }
.bg-blue.is-active { background: linear-gradient(145deg, var(--deep-blue-start), var(--deep-blue-end)); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
.bg-red.is-active { background: linear-gradient(145deg, var(--active-red-start), var(--active-red-end)); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
.bg-green.is-active { background: linear-gradient(145deg, var(--active-green-start), var(--active-green-end)); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
.action-grid-btn { filter: grayscale(0%) brightness(1.0); opacity: 1; z-index: 10; box-shadow: 0 3px 5px rgba(0,0,0,0.2), inset 0 1px 2px rgba(255,255,255,0.3); flex-direction: column; transform: scale(1); animation: none; border-radius: 8px; aspect-ratio: auto; height: 100%; min-height: 32px; font-size: 0.75rem; line-height: 1; grid-column: span 2; font-weight: 900; display: flex; align-items: center; justify-content: center; }

.btn-text { display: block; margin-top: 2px; opacity: 1; font-weight: 900; text-shadow: 0 1px 1px rgba(0,0,0,0.2); }

<script>
// ==================== Toast 定时器管理 ====================
let toastTimer = null;

// ==================== 统一弹窗管理器 ====================
const ModalManager = (function() {
    const modals = {
        confirm: {
            overlay: document.getElementById('confirmModal'),
            title: document.getElementById('confirmModalTitle'),
            message: document.getElementById('confirmModalMessage'),
            cancelBtn: document.getElementById('modalConfirmCancel'),
            confirmBtn: document.getElementById('modalConfirmOk')
        },
        danger: {
            overlay: document.getElementById('dangerConfirmModal'),
            title: document.getElementById('dangerModalTitle'),
            message: document.getElementById('dangerModalMessage'),
            cancelBtn: document.getElementById('modalDangerCancel'),
            confirmBtn: document.getElementById('modalDangerConfirm')
        },
        copy: {
            overlay: document.getElementById('copyPreviewModal'),
            title: document.querySelector('#copyPreviewModal .modal-title'),
            message: document.getElementById('copyPreviewMessage'),
            cancelBtn: document.getElementById('modalCopyCancel'),
            confirmBtn: document.getElementById('modalCopyConfirm')
        },
        bet: {
            overlay: document.getElementById('betConfirmModal'),
            title: document.querySelector('#betConfirmModal .modal-title'),
            message: document.getElementById('betConfirmMessage'),
            cancelBtn: document.getElementById('modalBetCancel'),
            confirmBtn: document.getElementById('modalBetConfirm')
        }
    };
    
    let activeModal = null;
    
    function close() {
        if (activeModal) {
            const m = modals[activeModal];
            if (m) {
                m.overlay.style.display = 'none';
                if (m.title) m.title.style.marginBottom = '';
                if (m.message) {
                    m.message.style.display = '';
                    m.message.style.textAlign = '';
                }
            }
            activeModal = null;
        }
    }
    
    async function showConfirm(options) {
        const { title, message = '', onConfirm, isDanger = false, isHtml = false, hideMessage = false } = options;
        const type = isDanger ? 'danger' : 'confirm';
        const m = modals[type];
        
        close();
        activeModal = type;
        
        m.title.textContent = title;
        m.title.style.marginBottom = '';
        
        let finalHtml = '';
        if (hideMessage) {
            m.message.style.display = 'none';
            m.title.style.marginBottom = '32px';
        } else {
            m.message.style.display = '';
            if (isHtml) {
                finalHtml = message;
            } else if (message) {
                finalHtml = message.replace(/([^0-9\s\.<>\/]+)/g, '<span class="chinese-text">$1</span>');
            }
            m.message.innerHTML = finalHtml;
        }
        
        m.overlay.style.display = 'flex';
        
        m.confirmBtn.onclick = async () => {
            await playSound('click');
            close();
            if (onConfirm) onConfirm();
        };
        m.cancelBtn.onclick = async () => {
            await playSound('click');
            close();
        };
        m.overlay.onclick = async (e) => {
            if (e.target === m.overlay) {
                await playSound('click');
                close();
            }
        };
    }
    
    async function showCopyPreview(options) {
        const { html, plain, onConfirm } = options;
        const m = modals.copy;
        
        close();
        activeModal = 'copy';
        
        m.message.innerHTML = html;
        m.message.style.textAlign = 'left';
        m.overlay.style.display = 'flex';
        
        m.confirmBtn.onclick = async () => {
            await SoundManager.playMarioPowerupReveal();
            close();
            if (onConfirm) onConfirm(plain);
        };
        m.cancelBtn.onclick = async () => {
            await playSound('click');
            close();
        };
        m.overlay.onclick = async (e) => {
            if (e.target === m.overlay) {
                await playSound('click');
                close();
            }
        };
    }
    
    async function showBetConfirm(options) {
        const { nums, amount, onConfirm } = options;
        const m = modals.bet;
        
        close();
        activeModal = 'bet';
        
        const sorted = [...nums].sort((a, b) => a - b);
        const numsHtml = buildNumsHtml(sorted);
        const unit = nums.size === 1 ? '买' : '各';
        const finalHtml = `<div style="text-align:center">${numsHtml} ${unit}${amount}元</div>`;
        
        m.message.innerHTML = finalHtml;
        m.overlay.style.display = 'flex';
        
        m.confirmBtn.onclick = async () => {
            await playSound('cash');
            close();
            if (onConfirm) onConfirm();
        };
        m.cancelBtn.onclick = async () => {
            await playSound('click');
            close();
        };
        m.overlay.onclick = async (e) => {
            if (e.target === m.overlay) {
                await playSound('click');
                close();
            }
        };
    }
    
    return { showConfirm, showCopyPreview, showBetConfirm, close };
})();

// ==================== 统一音效管理器 ====================
const SoundManager = (function(){
    let audioCtx = null;
    const N = { C3:130.81, E3:164.81, G3:196.00, C4:261.63, D4:293.66, E4:329.63, G4:392.00, A4:440.00, C5:523.25, D5:587.33, E5:659.25, G5:784.00, A5:880.00, B5:987.77, C6:1046.50, D6:1174.66, E6:1318.51, G6:1567.98, A6:1760.00, C7:2093.00, E7:2637.02, G7:3135.96, C8:4186.01 };
    
    async function activate() {
        if (audioCtx && audioCtx.state === 'running') return true;
        
        if (audioCtx && audioCtx.state === 'suspended') {
            try {
                await Promise.race([
                    audioCtx.resume(),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 500))
                ]);
                if (audioCtx.state === 'running') return true;
            } catch(e) {}
            try { audioCtx.close(); } catch(e) {}
            audioCtx = null;
        }
        
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { return false; }
        }
        
        if (audioCtx.state === 'suspended') {
            try {
                await Promise.race([
                    audioCtx.resume(),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 500))
                ]);
            } catch(e) { return false; }
        }
        
        return audioCtx.state === 'running';
    }
    
    function playNote(freq, when, dur, vol, type='sine', pan=0) {
        if (!audioCtx || audioCtx.state !== 'running') return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const panner = audioCtx.createStereoPanner();
            osc.type = type;
            osc.frequency.value = freq;
            panner.pan.value = pan;
            gain.gain.setValueAtTime(vol, when);
            gain.gain.exponentialRampToValueAtTime(0.001, when + dur * 0.6);
            osc.connect(gain);
            gain.connect(panner);
            panner.connect(audioCtx.destination);
            osc.start(when);
            osc.stop(when + dur);
        } catch(e) {}
    }
    
    function playChord(notes, when, dur, vol, type='triangle') {
        notes.forEach(f => playNote(f, when, dur, vol, type, 0));
    }

    async function play(type) {
        const ok = await activate();
        if (!ok || !audioCtx || audioCtx.state !== 'running') return;
        const t = audioCtx.currentTime;
        switch(type) {
            case 'click': playNote(1600, t, 0.04, 0.5, 'triangle'); playNote(2400, t+0.005, 0.03, 0.25, 'sine'); break;
            case 'pop': { const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='sine'; o.frequency.setValueAtTime(450,t); o.frequency.exponentialRampToValueAtTime(350,t+0.08); g.gain.setValueAtTime(0.42,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.12); } break;
            case 'coin': playNote(523,t,0.12,0.4,'sine'); playNote(659,t,0.12,0.3,'sine'); playNote(1046,t+0.02,0.1,0.2,'triangle'); break;
            case 'shutter': playNote(2400,t,0.03,0.42,'triangle'); playNote(800,t+0.01,0.05,0.25,'sine'); playNote(400,t+0.02,0.04,0.17,'sawtooth'); break;
            case 'slip': { const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(500,t); o.frequency.exponentialRampToValueAtTime(150,t+0.2); g.gain.setValueAtTime(0.42,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.28); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.28); playNote(80,t+0.18,0.1,0.3,'sine'); } break;
            case 'cash': playNote(120,t,0.06,0.5,'triangle'); playNote(80,t+0.01,0.04,0.3,'sine'); [N.C5,N.E5,N.G5,N.C6,N.E6,N.G6,N.C7,N.G6,N.E6,N.C6,N.G5,N.E5].forEach((f,i)=>playNote(f,t+0.08+i*0.03,0.12,0.2,'triangle')); setTimeout(()=>{ if(audioCtx && audioCtx.state === 'running') playChord([N.C4,N.E4,N.G4,N.C5], audioCtx.currentTime, 0.6, 0.25, 'triangle'); },500); break;
        }
    }

    async function playMarioCoinTick() {
        const ok = await activate();
        if (!ok || !audioCtx || audioCtx.state !== 'running') return;
        const t = audioCtx.currentTime;
        playNote(1318, t, 0.05, 0.1, 'square');
        playNote(1760, t+0.02, 0.05, 0.1, 'square');
    }
    
    async function playMarioCoinReveal() {
        const ok = await activate();
        if (!ok || !audioCtx || audioCtx.state !== 'running') return;
        const t = audioCtx.currentTime;
        playNote(1046, t, 0.08, 0.3, 'square');
        playNote(1318, t+0.03, 0.08, 0.3, 'square');
        playNote(1568, t+0.06, 0.08, 0.3, 'square');
        playNote(2093, t+0.09, 0.15, 0.3, 'square');
    }
    
    async function playMarioPowerupReveal() {

function getUndoActionDescription(a){
    if(a.type==='input_text'){
        const txt = a.prevText || '';
        if(!txt) return '输入';
        const chineseOnly = extractChineseLabel(txt);
        return chineseOnly || '输入';
    }
    if(a.type==='history_delete'){
        const it = a.deletedItem;
        const pure = it.isPureZodiac;
        const cnt = pure ? (it.labelPrefix.match(/^(\d+)肖/)?.[1] || it.numbers.length) : it.numbers.length;
        const unit = pure ? '肖' : '码';
        return `删除选号历史${cnt}${unit}`;
    }
    if(a.type==='global_highlight') return a.newValue?fmtNum(a.newValue):'高亮';
    if(a.type==='bet_confirm') return '买';
    if(a.type==='bet_cancel') return '取消买';
    if(a.type==='temp_store') return '暂存号码';
    if(a.type==='temp_restore') return '恢复暂存';
    if(a.type==='temp_clear') return '清空暂存';
    if(a.type==='special_add') return '随机特码';
    if(a.type==='special_remove') return '取消特码';
    if(a.type==='manual_select') return '点亮';
    if(a.type==='manual_deselect') return '熄灭';
    if(a.type==='manual_betting_toggle') return a.wasAdded ? '待购' : '取消待购';
    if(a.type==='clear_betting') return '清空待购';
    if(a.type==='clear_bet_results') return '清空结果';
    if(a.type==='freq_batch'){
        const prefix = a.wasAdded ? '亮' : '熄';
        return `${prefix}重复${a.label.match(/\d+/)?.[0] || ''}次的号码`;
    }
    if(a.type==='history_label_on') return `亮历史记录${a.labelPrefix || ''}`;
    if(a.type==='history_label_off') return `灭历史记录${a.labelPrefix || ''}`;
    if(a.type==='select_wave') return a.wasAdded ? `亮${a.label}` : `熄${a.label}`;
    if(a.type==='select_tail') return a.wasAdded ? `亮${a.label}` : `熄${a.label}`;
    if(a.type==='batch_kill'){
        if (zodiacs.includes(a.label)) return `灭${a.label}`;
        if (a.label.includes('字头')) return `杀${a.label}`;
        if (a.label.includes('属性')) return `杀${a.label}`;
        if (a.label.includes('尾')) return `杀${a.label}`;
        if (a.label.includes('红')||a.label.includes('蓝')||a.label.includes('绿')) return `杀${a.label}`;
        if (['大单','小单','大双','小双'].includes(a.label)) return `杀${a.label}`;
        return a.label;
    }
    if(a.type==='batch_select'){
        if (zodiacs.includes(a.label)) return a.wasAdded ? `亮${a.label}` : `灭${a.label}`;
        return a.wasAdded ? `亮${a.label}` : `熄${a.label}`;
    }
    if(a.type==='batch_betting_add') return a.label.includes('全选') ? a.label : '待购';
    if(a.type==='batch_betting_remove') return a.label.includes('全选') ? `取消${a.label}` : '取消待购';
    if(a.type==='batch_input'){
        if (a.label.includes('随机')) return '随机号码';
        const txt = a.rawText || '';
        return extractChineseLabel(txt) || '输入';
    }
    if(a.type==='zodiac_input') return `输入${a.label}`;
    if(a.numbers?.length===1) return fmtNum(a.numbers[0]);
    return a.label || '';
}

function formatUndoRedoMessage(action) {
    let numbers = action.numbers || [];
    if ((action.type === 'input_text' || action.type === 'batch_input') && numbers.length === 0) {
        const txt = action.prevText || action.nextText || action.rawText || '';
        numbers = parseNumbersFromText(txt);
    }
    const label = getUndoActionDescription(action);
    return buildTwoLineMessage(label, numbers);
}

    if(act.type==='bet_confirm'){ act.numbers.forEach(n=>{ delete betResults[n]; }); applySnapshot(act, selectedNumbers, bettingNumbers, betResults, specialNumbersSet); addLog("undo",`撤销买 ${formatNumbersForDisplay(act.numbers)}`); }
    else if(act.type==='bet_cancel'){ act.numbers.forEach(n=>{ betResults[n]=act.amount; }); addLog("undo",`恢复买 ${formatNumbersForDisplay(act.numbers)}`); }

    else if(act.type==='temp_restore'){ const restored=act.restoredNums||[], prev=act.prevTempData||[]; restored.forEach(n=>{ if(selectedNumbers.has(n)&&!act.alreadySelectedHas?.includes(n)) selectedNumbers.delete(n); }); tempStorageData=[...prev]; renderTempStorage(); updateTempCountBadge(); updateTempStoreBtn(); updateTempRestoreBtn(); updateTempClearBtn(); addLog("undo","撤销恢复暂存"); }
    else if(act.type==='temp_clear'){ tempStorageData=[...(act.prevTempData||[])]; renderTempStorage(); updateTempCountBadge(); updateTempStoreBtn(); updateTempRestoreBtn(); updateTempClearBtn(); addLog("undo","撤销清空暂存"); }
    else if(act.type==='special_add'){ act.numbers.forEach(n=>{ specialNumbersSet.delete(n); document.querySelector(`.num-btn[data-num="${n}"]`)?.classList.remove('is-special'); }); addLog("undo",`撤销随机特码 ${fmtNum(act.numbers[0])}`); }
    else if(act.type==='special_remove'){ act.numbers.forEach(n=>{ specialNumbersSet.add(n); document.querySelector(`.num-btn[data-num="${n}"]`)?.classList.add('is-special'); }); addLog("undo",`恢复取消特码 ${fmtNum(act.numbers[0])}`); }

    else if(act.type==='manual_deselect'){ selectedNumbers.add(act.number); if(act.specialState) syncRestoreSpecial(act.number, true); addLog("undo",`恢复点亮 ${fmtNum(act.number)}`); }

}, false, true); }

function a5(c,cb){ clearAllGoldHighlights(); let ang=0; const st=Date.now(), dur=5000; const run=()=>{ const p=Math.min((Date.now()-st)/dur,1); if(p<1){ clearAllGoldHighlights(); ang=(ang+(1-p)*0.5)%(Math.PI*2); for(let i=0;i<49;i++){ const n=allNumbersList[i], row=Math.floor((n-1)/12), col=(n-1)%12, dx=col-5.5, dy=row-2; const rc=Math.round(5.5+dx*Math.cos(ang)-dy*Math.sin(ang)), rr=Math.round(2+dx*Math.sin(ang)+dy*Math.cos(ang)); if(rr>=0&&rr<4&&rc>=0&&rc<12){ const t=customGridRows[rr]?.[rc]; if(t) document.querySelector(`.num-btn[data-num="${t}"]`)?.classList.add('gold-highlight'); } } setTimeout(run, Math.max(30, Math.floor(100*(1-p)))); } else { clearAllGoldHighlights(); cb(); } }; run(); }
function a6(c,cb){ clearAllGoldHighlights(); const st=Date.now(), dur=5000; const run=()=>{ const p=Math.min((Date.now()-st)/dur,1); if(p<1){ clearAllGoldHighlights(); const br=Math.sin(p*Math.PI*8)*0.5+0.5, cnt=Math.floor(br*49), sh=[...allNumbersList]; for(let i=sh.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [sh[i],sh[j]]=[sh[j],sh[i]]; } for(let i=0;i<cnt;i++) document.querySelector(`.num-btn[data-num="${sh[i]}"]`)?.classList.add('gold-highlight'); setTimeout(run,50); } else { clearAllGoldHighlights(); cb(); } }; run(); }
const schemes=[{id:2,name:'波纹',func:a2},{id:3,name:'数字雨',func:a3},{id:4,name:'贪吃蛇',func:a4},{id:5,name:'轮盘',func:a5},{id:6,name:'呼吸灯',func:a6}];

const blueRandomSoundNames = ['wave','rain','slot','scifi'];
async function handleBlueRandom(){ if(isAnimationRunning){ return; } if(selectedNumbers.size) showChoiceModal(c=>{ if(c==='keep') showNumberModal(c=>startRandomAnimation(c)); }); else showNumberModal(c=>startRandomAnimation(c)); }
async function startRandomAnimation(c){ if(c===null||isNaN(c)||c<1||c>49){ return; } document.getElementById('blueRandomBtn').classList.add('disabled'); isAnimationRunning=true; const schemeName = blueRandomSoundNames[Math.floor(Math.random()*blueRandomSoundNames.length)]; await BlueRandomSoundManager.initScheme(schemeName); BlueRandomSoundManager.playReveal(); const s=schemes[Math.floor(Math.random()*schemes.length)]; s.func(c, ()=>finalizeRandomNumbers(c)); }

async function showInputModal() {
    await playSound('click'); 
    const m = document.getElementById('inputModal'), ta = document.getElementById('modalInputArea'); 
    const inp = document.getElementById('smartInput');
    ta.value = inp.value;
    m.style.display = 'flex'; ta.focus();
    const resize = () => { ta.style.height = 'auto'; ta.style.height = Math.max(48, ta.scrollHeight) + 'px'; };
    ta.addEventListener('input', resize); resize();
    const close = () => { m.style.display = 'none'; ta.removeEventListener('input', resize); };
    const confirm = () => {
        const txt = ta.value.trim(); 
        if(!txt) { close(); return; }
        let pt = txt.replace(/[.,,;:;\\\/。.；：，、]/g, ' ');
        const invNums = (pt.match(/\d+/g)||[]).filter(m=>{ const n=parseInt(m); return n===0||n>49; });
        const invChars = [...pt.replace(/[\s]/g,'')].filter(c=>!/\d/.test(c)&&!ZODIAC_MAP.hasOwnProperty(c));
        if(invNums.length||invChars.length) {
            let err = ''; 
            if(invNums.length) err += `无效数字：${invNums.join('、')}`; 
            if(invChars.length) err += (err?'\n':'') + `无效字符：${[...new Set(invChars)].join('、')}`;
            playSound('slip'); 
            const em = document.getElementById('inputErrorModal'); 
            document.getElementById('inputErrorMessage').textContent = err; 
            em.style.display = 'flex';
            document.getElementById('modalErrorConfirm').onclick = async () => { await playSound('click'); em.style.display = 'none'; ta.focus(); }; 
            return;
        }
        close();
        inp.value = txt;
        updateZodiacButtonsFromInput(txt);
        processConfirm();
    };
    document.getElementById('modalInputConfirm').onclick = async () => { await playSound('click'); confirm(); };
    document.getElementById('modalInputCancel').onclick = async () => { await playSound('click'); close(); };
    m.onclick = async (e) => { if(e.target === m) { await playSound('click'); close(); } };
}

async function handleAmountButtonClick() {
    if (!bettingNumbers.size) { return; }
    await playSound('click');
    const m = document.getElementById('amountModal'), inp = document.getElementById('amountInput');
    inp.value = ''; m.style.display = 'flex'; inp.focus();
    const close = () => { m.style.display = 'none'; };
    const confirm = () => {
        const amt = parseInt(inp.value);
        if (isNaN(amt) || amt <= 0) { return; }
        close();
        showBetConfirmModal(bettingNumbers, amt);
    };
    document.getElementById('modalAmountConfirm').onclick = async () => { await playSound('click'); confirm(); };
    document.getElementById('modalAmountCancel').onclick = async () => { await playSound('click'); close(); };
    m.onclick = async (e) => { if(e.target === m) { await playSound('click'); close(); } };
    inp.onkeydown = async (e) => { if(e.key === 'Enter') { await playSound('click'); confirm(); } };
}

document.addEventListener('touchend', e=>{ const n=Date.now(); if(n-lastTouchEnd<=300){ const tag=e.target.tagName; if(tag!=='BUTTON'&&tag!=='SPAN'&&tag!=='DIV') e.preventDefault(); } lastTouchEnd=n; }, false);
document.addEventListener('gesturestart', e=>e.preventDefault());

// 首次触摸时激活 AudioContext（兜底方案）
document.addEventListener('touchstart', async () => {

}, { once: true });
