function updatePeriodDisplay() { const now = new Date(); const baseDate = new Date(2026, 0, 1, 0, 0, 0, 0); const targetTime = 21 * 60 + 34; const nowTime = now.getHours() * 60 + now.getMinutes(); const nowSeconds = now.getSeconds(); let effectiveDate = new Date(now); if (nowTime > targetTime || (nowTime === targetTime && nowSeconds >= 1)) { effectiveDate.setDate(effectiveDate.getDate() + 1); } const diffDays = Math.floor((effectiveDate - baseDate) / (24 * 60 * 60 * 1000)); currentPeriod = diffDays + 1; if (currentPeriod < 1) currentPeriod = 1; const target = new Date(now); target.setHours(21, 34, 0, 0); if (now > target) { target.setDate(target.getDate() + 1); } const diff = target - now; if (diff < 0) diff = 0; const totalSeconds = Math.floor(diff / 1000); const hours = Math.floor(totalSeconds / 3600); const minutes = Math.floor((totalSeconds % 3600) / 60); const seconds = totalSeconds % 60; const countdown = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`; const periodStr = String(currentPeriod).padStart(3, '0'); const el = document.getElementById('statsPeriodContent'); if (el) el.textContent = `第【${periodStr}】期 ${countdown}`; }
async function handleAmountButtonClick() { await playSound('click'); if (!bettingNumbers.size) { return; } await playSound('click'); const m = document.getElementById('amountModal'), inp = document.getElementById('amountInput'), unitInp = document.getElementById('unitInput'); if (amountInputHandler) { inp.removeEventListener('input', amountInputHandler); } if (unitInputHandler) { unitInp.removeEventListener('input', unitInputHandler); } if (unitFocusHandler) { unitInp.removeEventListener('focus', unitFocusHandler); } inp.value = ''; unitInp.value = ''; m.style.display = 'flex'; inp.focus(); const close = () => { m.style.display = 'none'; }; const confirm = () => { const amtStr = inp.value.trim(); const unitStr = unitInp.value.trim(); if (!amtStr) { showToast("请输入金额"); inp.focus(); return; } if (!unitStr) { showToast("请输入金额单位"); unitInp.focus(); return; } const amt = parseInt(amtStr); if (isNaN(amt) || amt < 1) { showToast("请输入有效内容"); inp.focus(); return; } close(); showBetConfirmModal(bettingNumbers, amt, unitStr); }; amountInputHandler = function(e) { let val = this.value; val = val.replace(/[^0-9]/g, ''); if (val.startsWith('0')) { val = val.replace(/^0+/, ''); } this.value = val; }; unitInputHandler = function(e) { let val = this.value; const validChars = []; for (const ch of val) { const isChinese = /[\u4e00-\u9fff]/.test(ch); const isEnglish = /[a-zA-Z]/.test(ch); const isAllowed = ch === '@' || ch === '#' || ch === '$' || ch === '&'; if (isChinese || isEnglish || isAllowed) { validChars.push(ch); } else { showToast("请输入有效内容"); } } this.value = validChars.join(''); }; unitFocusHandler = function(e) { if (!inp.value.trim()) { showToast("请先输入金额"); inp.focus(); } }; inp.addEventListener('input', amountInputHandler); unitInp.addEventListener('input', unitInputHandler); unitInp.addEventListener('focus', unitFocusHandler); document.getElementById('modalAmountConfirm').onclick = async () => { await playSound('click'); confirm(); }; document.getElementById('modalAmount
